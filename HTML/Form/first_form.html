<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <h1>University Registration Form</h1>
        <p>Please fill out the form</p>
        <hr>

        <!-- Personal Details -->

        <h1>Personal Details</h1>

        <!-- First Name -->
        <label for="First Name">First Name:</label>
        <input type="text" name="UserName" id="First Name" placeholder="e.g.Arjun" required>
        <br><br>
        <!-- Last Name -->
        <label for="Last Name">Last Name:</label>
        <input type="text" name="LastName" id="Last Name" placeholder="e.g. Kumar">
        <br><br>
        <!-- DOB -->
        <label for="Date of Birth">Date of Birth:</label>
        <input type="date" name="DOB" id="Date of Birth">
        <br><br>
        <!-- Gender -->
        <label for="Gender">Gender:</label>
        <br>

        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other">
        <label for="other">Other</label>
        <br><br>
        <!-- Photo -->
        <p>Upload Your Photo:</p>
        <input type="file" name="file">
        <hr>
        <!-- Contact Information -->
        <h1>Contact Information</h1>
        <label for="Email Address">Email Address</label>
        <input type="text" name="email" id="Email Address" placeholder="you@example.com">
        <br><br>
        <label for="phone no.">Phone Number</label>
        <input type="number" name="phone no." id="phone no." placeholder="e.g.0123456789">
        <br><br>
        <label for="Mail">Mailing Address:</label>
        <br>
        <textarea name="Address" id="Address" rows="5" placeholder="Street Address, City, State, Zip Code"></textarea>
        <hr>
        <!-- Academic Information -->
        <h1>Academic Information</h1>
        <label for="Course">Select Your Course: </label>
        <select name="course" id="course">
            <option value="select">--Select Course--</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="CE">CE</option>
        </select>
        <br>
        <p>Extracurricular Interests:</p>
        <input type="checkbox" name="extreCurricular" id="sports" value="sports">
        <label for="sports">Sports</label>
        <br>
        <input type="checkbox" name="extreCurricular" id="music" value="music&arts">
        <label for="music">Music & Arts</label>
        <br>
        <input type="checkbox" name="extreCurricular" id="Technology Clubs" value="technology">
        <label for="Technology Clubs">Technology Clubs</label>
        <br>
        <input type="checkbox" name="extreCurricular" id="Volunteering" value="volunteering">
        <label for="Volunteering">Volunteering</label>

        <h1>Create Your Account</h1>
        <label for="password">Create a password: </label>
        <input type="password" name="password" id="password">
        <br><br>
        <label for="answer">Security Answer:</label>
        <input type="text" name="security" id="security">
        <br><br>
        <input type="checkbox" name="t&C" id="T&C">
        <label for="T&C">I agree to the Terms and Conditions.</label>
        <br><br>
        
        <button type="sumbit">Register</button>
        <button type="reset">Clear Form</button>
    </form>
</body>

</html>
